version: "3.9"

services:

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - POSTGRES_DB=identity_service_db

  redis:
    image: redis:7

  rabbitmq:
    image: rabbitmq:3-management

  mongo:
    image: mongo:8