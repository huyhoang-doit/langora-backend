server:
  port: 8080
  servlet:
    context-path: /langora

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  application:
    name: langora-backend
  banner:
    location: banner.txt
  datasource:
    url: "jdbc:postgresql://localhost:5432/identity_service_db"
    driverClassName: "org.postgresql.Driver"
